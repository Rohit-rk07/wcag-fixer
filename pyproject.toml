[project]
name = "wcag-fixer"
version = "0.1.0"
description = "WCAG-aware accessibility scanner and safe auto-fixer for HTML"
requires-python = ">=3.9"
dependencies = ["beautifulsoup4>=4.12"]

[project.optional-dependencies]
ai = ["anthropic"]
dev = ["pytest"]

[project.scripts]
wcag-fix = "wcag_fixer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
